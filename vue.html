<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂任務管理器｜Vue 版</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="page-width header-content">
        <div>
          <p class="eyebrow">VUE CLASSROOM TASKS</p>
          <h1>課堂任務管理器</h1>
          <p class="subtitle">使用 Vue 3 製作的獨立練習版本。</p>
        </div>
        <nav aria-label="版本切換">
          <a href="index.html">返回原生版本</a>
        </nav>
      </div>
    </header>

    <main id="vue-app" class="page-width" v-cloak>
      <section class="panel" aria-labelledby="add-heading">
        <h2 id="add-heading">新增任務</h2>
        <form id="task-form" class="task-form" @submit.prevent="addTask" novalidate>
          <label for="task-input">任務內容</label>
          <div class="input-row">
            <input
              id="task-input"
              ref="taskInput"
              v-model="newTaskName"
              name="task"
              type="text"
              maxlength="200"
              placeholder="例如：練習 Vue 元件"
              autocomplete="off"
              aria-describedby="form-message"
              required
            >
            <button class="add-button" type="submit">新增任務</button>
          </div>
          <p
            id="form-message"
            class="form-message"
            :class="{ error: formMessageType === 'error' }"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >{{ formMessage }}</p>
        </form>
      </section>

      <!-- 重要語意區：Vue 任務清單與操作狀態集中在這個 section。 -->
      <section class="panel task-panel" aria-labelledby="list-heading">
        <div class="section-heading">
          <h2 id="list-heading">任務清單</h2>
          <span class="version-badge">Vue 3</span>
        </div>

        <p id="empty-state" class="empty-state" v-if="tasks.length === 0">目前沒有任務，先新增第一項吧！</p>
        <ul id="task-list" class="task-list" aria-label="任務">
          <li
            v-for="task in tasks"
            :key="task.id"
            class="task-item"
            :class="{ completed: task.completed }"
          >
            <label class="task-check">
              <input
                type="checkbox"
                :checked="task.completed"
                :aria-label="`切換任務完成狀態：${task.name}`"
                @change="toggleTask(task.id)"
              >
              <span class="task-name">{{ task.name }}</span>
            </label>
            <button
              class="delete-button"
              type="button"
              :data-task-id="task.id"
              :aria-label="`刪除任務：${task.name}`"
              @click="deleteTask(task.id)"
            >刪除</button>
          </li>
        </ul>

        <div id="stats" class="stats" aria-label="任務統計">
          <p>總數 <strong id="total-count">{{ totalCount }}</strong></p>
          <p>未完成 <strong id="pending-count">{{ pendingCount }}</strong></p>
          <p>已完成 <strong id="completed-count">{{ completedCount }}</strong></p>
        </div>
      </section>
    </main>

    <script src="vendor/vue.global.prod.js"></script>
    <script src="vue-app.js"></script>
  </body>
</html>
